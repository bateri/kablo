[package]
name = "kablo-package"
description = "The programs a machine has: the folder bateri's apps are kept in, and the one place that writes it. Checks what it is given (signature, sum, key) before it puts it there."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kablo-bateri = { path = "../kablo-bateri" }
# What a program's `app.json` may say and whether its signature holds, and the sum of a file:
# the rules bateri's terminal and this crate both read, written once in pencere. The whole
# crate comes with it (`apps` cannot be taken alone); only this crate uses it, and the keeper
# and the bridge never call it. Apache-2.0.
pencere-host = { git = "https://github.com/bateri/pencere", rev = "a529ade0f42f0a14a11a24e414a61f904f173d96" }

[lints]
workspace = true
