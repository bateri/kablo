[workspace]
members = ["crates/kablo-proto", "crates/kablo-screen", "crates/kablo"]
resolver = "3"
# The fork of the terminal parser (`[patch.crates-io]` below) is upstream's code in
# upstream's style: not a member, so `fmt` and `clippy` leave it alone. Its tests run from
# the Makefile. `exclude` is also what lets cargo find it inside a git dependency:
# without it cargo takes `vendor/vte` for a member of this workspace and refuses to
# load it from a checkout of this repository.
exclude = ["vendor/vte"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

# The parsers read bytes from a peer: a panic there is a remote crash, so the
# panicking shortcuts are errors outside tests (clippy.toml lets tests use them).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The terminal emulator the relay keeps a screen with and `kablo-screen` writes images
# from: the same crate, at the same version, as bateri's (`=`: its private details are
# probed from outside, see `kablo-screen`). The default feature (serde) is off: nothing
# here serializes a terminal.
[workspace.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }

# `vte`, the parser inside `alacritty_terminal`, is a fork kept in `vendor/vte` (upstream
# 0.15.0 plus the changes in its `FORK.md`): the relay and bateri parse with this one
# source, and bateri takes it from this repository by a pinned commit. Same name and
# version, so `alacritty_terminal` resolves to it unchanged. When it stops applying
# (a newer `vte` asked for) cargo only warns and builds the registry's one.
[patch.crates-io]
vte = { path = "vendor/vte" }
